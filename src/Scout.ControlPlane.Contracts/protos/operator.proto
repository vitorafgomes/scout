syntax = "proto3";

package scout.controlplane.v1;

option csharp_namespace = "Scout.ControlPlane.Contracts";

service Operator {
  rpc GetMandate(GetMandateRequest) returns (Mandate);
  rpc SaveMandate(Mandate) returns (Mandate);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc GetProject(GetProjectRequest) returns (Project);
  rpc StartProject(StartProjectRequest) returns (Project);
  rpc DecideClaim(DecideClaimRequest) returns (Project);
  rpc ProduceProject(GetProjectRequest) returns (Project);
  rpc ReorderScenes(ReorderScenesRequest) returns (Project);
  rpc SetSceneLocked(SetSceneLockedRequest) returns (Project);
  rpc RegenerateScene(SceneRequest) returns (Project);
  rpc AttachSceneMedia(AttachSceneMediaRequest) returns (Project);
  rpc GetMediaDirectory(GetProjectRequest) returns (MediaDirectory);
  rpc GetReadiness(GetReadinessRequest) returns (Readiness);
}

message GetMandateRequest {}

message Mandate {
  string objective = 1;
  string audience = 2;
  repeated string pillars = 3;
  string cadence = 4;
  string language = 5;
  string voice_and_style = 6;
  repeated string blocked_topics = 7;
  string target_metric = 8;
  string target_value = 9;
  optional string updated_at = 10;
}

message ListProjectsRequest {
  int32 limit = 1;
}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message GetProjectRequest {
  string id = 1;
}

message StartProjectRequest {
  string topic = 1;
}

message DecideClaimRequest {
  string project_id = 1;
  string claim_id = 2;
  string status = 3;
  optional string note = 4;
}

message Project {
  string id = 1;
  string topic = 2;
  string status = 3;
  string origin = 4;
  string created_at = 5;
  string updated_at = 6;
  repeated TopicCandidate candidates = 7;
  optional Script script = 8;
  repeated Claim claims = 9;
  optional string error = 10;
  repeated Scene scenes = 11;
}

message TopicCandidate {
  string title = 1;
  string reason = 2;
  double fit = 3;
}

message Script {
  string hook = 1;
  repeated ScriptSection sections = 2;
  string call_to_action = 3;
  repeated string title_variants = 4;
  string description = 5;
  repeated string tags = 6;
  repeated Chapter chapters = 7;
}

message ScriptSection {
  string heading = 1;
  string narration = 2;
}

message Chapter {
  string at = 1;
  string title = 2;
}

message Claim {
  string id = 1;
  string text = 2;
  string risk = 3;
  repeated string source_urls = 4;
  string status = 5;
  optional string note = 6;
}

message Scene {
  string id = 1;
  int32 order = 2;
  string narration = 3;
  string visual_prompt = 4;
  bool locked = 5;
  string status = 6;
  optional string error = 7;
  string audio_source = 8;
  string visual_source = 9;
  optional string audio_file = 10;
  optional string visual_file = 11;
  int32 duration_ms = 12;
}

message ReorderScenesRequest {
  string project_id = 1;
  repeated string scene_ids = 2;
}

message SetSceneLockedRequest {
  string project_id = 1;
  string scene_id = 2;
  bool locked = 3;
}

message SceneRequest {
  string project_id = 1;
  string scene_id = 2;
}

message AttachSceneMediaRequest {
  string project_id = 1;
  string scene_id = 2;
  string kind = 3;
  string file_name = 4;
}

message MediaDirectory {
  string path = 1;
}

message GetReadinessRequest {}

message Readiness {
  bool speech_available = 1;
  bool images_available = 2;
  string provider = 3;
  bool ffmpeg_available = 4;
  bool youtube_signed_in = 5;
  repeated string notes = 6;
  optional string reported_at = 7;
}
