syntax = "proto3";

package scout.controlplane.v1;

option csharp_namespace = "Scout.ControlPlane.Contracts";

service Operator {
  rpc GetMandate(GetMandateRequest) returns (Mandate);
  rpc SaveMandate(Mandate) returns (Mandate);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc GetProject(GetProjectRequest) returns (Project);
  rpc StartProject(StartProjectRequest) returns (Project);
  rpc DecideClaim(DecideClaimRequest) returns (Project);
  rpc ProduceProject(ProduceProjectRequest) returns (Project);
  rpc DelegateProject(DelegateProjectRequest) returns (Project);
  rpc ReorderScenes(ReorderScenesRequest) returns (Project);
  rpc SetSceneLocked(SetSceneLockedRequest) returns (Project);
  rpc RegenerateScene(SceneRequest) returns (Project);
  rpc AttachSceneMedia(AttachSceneMediaRequest) returns (Project);
  rpc GetMediaDirectory(GetProjectRequest) returns (MediaDirectory);
  rpc DeleteProject(GetProjectRequest) returns (DeleteProjectResponse);
  rpc GetReadiness(GetReadinessRequest) returns (Readiness);
  rpc AssembleProject(GetProjectRequest) returns (Project);
  rpc ConfirmMediaRights(GetProjectRequest) returns (Project);
  rpc EditPackageMetadata(EditPackageMetadataRequest) returns (Project);
  rpc ApprovePackage(GetProjectRequest) returns (Project);
  rpc PublishPackage(PublishPackageRequest) returns (Project);
  rpc DecideProposal(DecideProposalRequest) returns (Project);
  rpc StartExperiment(StartExperimentRequest) returns (Project);
  rpc AdoptExperimentWinner(GetProjectRequest) returns (Project);
  rpc ListComments(ListCommentsRequest) returns (CommentsView);
  rpc RequestCommentSync(ListCommentsRequest) returns (CommentsView);
  rpc DecideComment(DecideCommentRequest) returns (CommentsView);
  rpc ApproveReply(ApproveReplyRequest) returns (CommentsView);
  rpc DecideIdea(DecideIdeaRequest) returns (CommentsView);
  rpc GetVoiceSamplesDirectory(GetVoiceSamplesDirectoryRequest) returns (MediaDirectory);
  rpc EditSceneText(EditSceneTextRequest) returns (Project);
  rpc RegenerateNarration(SceneRequest) returns (Project);
  rpc SetMouthBox(SetMouthBoxRequest) returns (Project);
  rpc RegeneratePresenter(GetProjectRequest) returns (Project);
  rpc RequestPresenter(RequestPresenterRequest) returns (Project);
  rpc UsePresenterVersion(UsePresenterVersionRequest) returns (Project);
  rpc RemovePresenterVersion(RemovePresenterVersionRequest) returns (Project);
  rpc ListBuiltInPresenters(ListBuiltInPresentersRequest) returns (BuiltInPresenters);
  rpc EditScenePicturePrompt(EditScenePicturePromptRequest) returns (Project);
  rpc RegenerateScenePicture(SceneRequest) returns (Project);
}

message GetMandateRequest {}

message Mandate {
  string objective = 1;
  string audience = 2;
  repeated string pillars = 3;
  string cadence = 4;
  string language = 5;
  string voice_and_style = 6;
  repeated string blocked_topics = 7;
  string target_metric = 8;
  string target_value = 9;
  optional string updated_at = 10;
  reserved 11;
  string default_format = 12;
}

message ListProjectsRequest {
  int32 limit = 1;
}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message DeleteProjectResponse {}

message GetProjectRequest {
  string id = 1;
}

message ProduceProjectRequest {
  string id = 1;
  string narration_voice = 2;
  string direction = 3;
  string motion = 4;
  string presenter = 5;
}

message DelegateProjectRequest {
  string id = 1;
  string narration_voice = 2;
  string direction = 3;
  string motion = 4;
  string presenter = 5;
}

message StartProjectRequest {
  string topic = 1;
  string format = 2;
  string direction = 3;
  string presenter = 4;
}

message DecideClaimRequest {
  string project_id = 1;
  string claim_id = 2;
  string status = 3;
  optional string note = 4;
}

message Project {
  string id = 1;
  string topic = 2;
  string status = 3;
  string origin = 4;
  string created_at = 5;
  string updated_at = 6;
  repeated TopicCandidate candidates = 7;
  optional Script script = 8;
  repeated Claim claims = 9;
  optional string error = 10;
  repeated Scene scenes = 11;
  optional VideoPackage package = 12;
  optional Publication publication = 13;
  optional string background_file = 14;
  bool delegated = 15;
  string narration_voice = 16;
  string direction = 17;
  string motion = 18;
  string format = 19;
  optional string recording_file = 20;
  int32 recording_ms = 21;
  string presenter = 22;
  optional string presenter_file = 23;
  optional MouthBox mouth_box = 24;
  repeated PresenterVersion presenter_versions = 25;
  optional string presenter_preview_file = 26;
  string presenter_request = 27;
  string presenter_source = 28;
  string presenter_return_status = 29;
  string presenter_request_prompt = 30;
}

message PresenterVersion {
  string file = 1;
  string prompt = 2;
  string feedback = 3;
  optional string preview_file = 4;
  optional MouthBox mouth_box = 5;
  string made_at = 6;
  string source = 7;
  string id = 8;
}

message MouthBox {
  double x = 1;
  double y = 2;
  double width = 3;
  double height = 4;
}

message TopicCandidate {
  string title = 1;
  string reason = 2;
  double fit = 3;
}

message Script {
  string hook = 1;
  repeated ScriptSection sections = 2;
  string call_to_action = 3;
  repeated string title_variants = 4;
  string description = 5;
  repeated string tags = 6;
  repeated Chapter chapters = 7;
}

message ScriptSection {
  string heading = 1;
  string narration = 2;
  int32 start_ms = 3;
  int32 end_ms = 4;
}

message Chapter {
  string at = 1;
  string title = 2;
}

message Claim {
  string id = 1;
  string text = 2;
  string risk = 3;
  repeated string source_urls = 4;
  string status = 5;
  optional string note = 6;
}

message Scene {
  string id = 1;
  int32 order = 2;
  string narration = 3;
  string visual_prompt = 4;
  bool locked = 5;
  string status = 6;
  optional string error = 7;
  string audio_source = 8;
  string visual_source = 9;
  optional string audio_file = 10;
  optional string visual_file = 11;
  int32 duration_ms = 12;
  string visual_query = 13;
  optional string visual_credit = 14;
  int32 clip_start_ms = 15;
  int32 clip_end_ms = 16;
}

message ReorderScenesRequest {
  string project_id = 1;
  repeated string scene_ids = 2;
}

message SetSceneLockedRequest {
  string project_id = 1;
  string scene_id = 2;
  bool locked = 3;
}

message SceneRequest {
  string project_id = 1;
  string scene_id = 2;
}

message SetMouthBoxRequest {
  string project_id = 1;
  MouthBox mouth_box = 2;
}

message RequestPresenterRequest {
  string project_id = 1;
  string feedback = 2;
  string prompt = 3;
}

message UsePresenterVersionRequest {
  string project_id = 1;
  reserved 2;
  reserved "index";
  string version_id = 3;
}

message RemovePresenterVersionRequest {
  string project_id = 1;
  reserved 2;
  reserved "index";
  string version_id = 3;
}

message ListBuiltInPresentersRequest {}

message BuiltInPresenters {
  repeated BuiltInPresenter presenters = 1;
}

message BuiltInPresenter {
  string id = 1;
  string label = 2;
}

message EditScenePicturePromptRequest {
  string project_id = 1;
  string scene_id = 2;
  string prompt = 3;
}

message EditSceneTextRequest {
  string project_id = 1;
  string scene_id = 2;
  string text = 3;
}

message AttachSceneMediaRequest {
  string project_id = 1;
  string scene_id = 2;
  string kind = 3;
  string file_name = 4;
}

message MediaDirectory {
  string path = 1;
}

message GetReadinessRequest {}

message Readiness {
  bool speech_available = 1;
  bool images_available = 2;
  string provider = 3;
  bool ffmpeg_available = 4;
  bool youtube_signed_in = 5;
  repeated string notes = 6;
  optional string reported_at = 7;
  repeated Voice voices = 8;
  bool stock_pictures = 9;
  bool transcription_available = 10;
  bool lip_sync_available = 11;
  bool face_detection_available = 12;
  int32 pictures_left_today = 13;
  repeated BuiltInPresenter builtin_presenters = 14;
}

message Voice {
  string id = 1;
  string label = 2;
  string source = 3;
  optional string sample_file = 4;
}

message VideoPackage {
  string status = 1;
  optional string video_file = 2;
  repeated ShortClip shorts = 3;
  optional string thumbnail_file = 4;
  repeated PackageCheck checks = 5;
  bool rights_confirmed = 6;
  optional string approved_at = 7;
  string title = 8;
  string description = 9;
  repeated string tags = 10;
  int32 duration_ms = 11;
  optional string error = 12;
  bool metadata_edited = 13;
  optional string assembled_at = 14;
  optional string metadata_saved_at = 15;
  optional string rights_confirmed_at = 16;
  optional string thumbnail_description = 17;
}

message ShortClip {
  string file = 1;
  int32 start_ms = 2;
  int32 duration_ms = 3;
  string hook = 4;
}

message PackageCheck {
  string name = 1;
  string result = 2;
  string detail = 3;
}

message EditPackageMetadataRequest {
  string project_id = 1;
  string title = 2;
  string description = 3;
  repeated string tags = 4;
}

message Publication {
  string status = 1;
  optional string video_id = 2;
  string privacy_status = 3;
  optional string publish_at = 4;
  bool made_for_kids = 5;
  bool synthetic_media = 6;
  optional string uploaded_at = 7;
  optional string error = 8;
  repeated Snapshot snapshots = 9;
  repeated Proposal proposals = 10;
  optional Experiment experiment = 11;
}

message Snapshot {
  string window = 1;
  string taken_at = 2;
  int64 views = 3;
  double minutes_watched = 4;
  double average_view_duration_seconds = 5;
  double average_view_percentage = 6;
  int64 subscribers_gained = 7;
  int64 subscribers_lost = 8;
  int64 likes = 9;
  int64 comments = 10;
  int64 shares = 11;
  optional int64 impressions = 12;
  optional double impressions_ctr = 13;
  repeated RetentionPoint retention = 14;
}

message RetentionPoint {
  double elapsed_ratio = 1;
  double audience_watch_ratio = 2;
}

message Proposal {
  string id = 1;
  string kind = 2;
  string text = 3;
  string reason = 4;
  string status = 5;
  optional string thumbnail_file = 6;
}

message Experiment {
  string id = 1;
  string kind = 2;
  string status = 3;
  repeated ExperimentArm arms = 4;
  optional string winner_arm_id = 5;
  optional string result = 6;
}

message ExperimentArm {
  string id = 1;
  string label = 2;
  string value = 3;
  optional string started_at = 4;
  optional string ended_at = 5;
  int64 impressions = 6;
  int64 clicks = 7;
  double average_view_percentage = 8;
}

message PublishPackageRequest {
  string project_id = 1;
  string privacy_status = 2;
  optional string publish_at = 3;
  bool made_for_kids = 4;
  bool synthetic_media = 5;
}

message DecideProposalRequest {
  string project_id = 1;
  string proposal_id = 2;
  bool accept = 3;
}

message StartExperimentRequest {
  string project_id = 1;
  int32 arm_hours = 2;
}

message ListCommentsRequest {}

message DecideCommentRequest {
  string comment_id = 1;
  string decision = 2;
}

message ApproveReplyRequest {
  string comment_id = 1;
  string text = 2;
}

message DecideIdeaRequest {
  string idea_id = 1;
  bool use = 2;
}

message AudienceComment {
  string id = 1;
  string thread_id = 2;
  string video_id = 3;
  string video_title = 4;
  string author = 5;
  string text = 6;
  string published_at = 7;
  int64 like_count = 8;
  string kind = 9;
  string theme = 10;
  string status = 11;
  string draft = 12;
  optional string approved_text = 13;
  optional string reply_id = 14;
  optional string error = 15;
  optional string decided_at = 16;
  string fetched_at = 17;
}

message AudienceIdea {
  string id = 1;
  string text = 2;
  string comment_id = 3;
  string status = 4;
  optional string project_id = 5;
}

message CommentsView {
  repeated AudienceComment comments = 1;
  repeated AudienceIdea ideas = 2;
  optional string synced_at = 3;
  optional string sync_requested_at = 4;
  optional string sync_error = 5;
}

message GetVoiceSamplesDirectoryRequest {}
