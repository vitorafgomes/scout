name: UI CI

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'src/Scout.Host.Console/**'
      - 'src/Scout.Host.ControlPlane/**'
      - 'src/Scout.ControlPlane/**'
      - 'src/Scout.ControlPlane.Contracts/**'
      - '.github/workflows/ui-ci.yml'
      - 'global.json'
      - 'docs/**'
      - 'doc/**'
  pull_request:
    branches: [main]
    paths:
      - 'ui/**'
      - 'src/Scout.Host.Console/**'
      - 'src/Scout.Host.ControlPlane/**'
      - 'src/Scout.ControlPlane/**'
      - 'src/Scout.ControlPlane.Contracts/**'
      - '.github/workflows/ui-ci.yml'
      - 'global.json'
      - 'docs/**'
      - 'doc/**'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ui-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            dist_script: dist:linux
          - os: macos-latest
            rid: osx-arm64
            dist_script: dist:mac
          - os: windows-latest
            rid: win-x64
            dist_script: dist:win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.12'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Test (site)
        shell: bash
        run: bun test ./docs

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache Bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: ui
        shell: bash
        run: bun run lint

      - name: Typecheck
        working-directory: ui
        shell: bash
        run: bun run typecheck

      - name: Format check
        if: runner.os == 'Linux'
        working-directory: ui
        shell: bash
        run: bun run format

      - name: Build control-plane host
        shell: bash
        run: dotnet build src/Scout.Host.ControlPlane/Scout.Host.ControlPlane.csproj --configuration Release

      - name: Test (UI)
        working-directory: ui
        shell: bash
        run: bun run test

      - name: Publish worker binary
        working-directory: ui
        shell: bash
        run: bun run worker:publish -- ${{ matrix.rid }}

      - name: Cache media tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ui/build/media-cache
          key: media-tools-${{ runner.os }}-${{ hashFiles('ui/build/media-tools.json') }}

      - name: Cache Electron and packaging tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ hashFiles('ui/bun.lock', 'ui/build/electron-builder.yml') }}
          restore-keys: electron-builder-${{ runner.os }}-

      - name: Package
        working-directory: ui
        shell: bash
        run: bun run ${{ matrix.dist_script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scout-desktop-${{ matrix.os }}
          path: ui/build/dist/
          retention-days: 14
          if-no-files-found: error

  e2e:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.12'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Cache Bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Install the Electron binary
        working-directory: ui
        run: node packages/main/node_modules/electron/install.js

      - name: Install the virtual display and the keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb gnome-keyring dbus
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Build
        working-directory: ui
        run: bun run build

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Build control-plane host
        shell: bash
        run: dotnet build src/Scout.Host.ControlPlane/Scout.Host.ControlPlane.csproj --configuration Release

      - name: Test (end to end)
        working-directory: ui
        run: bun run test:e2e

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report
          path: |
            ui/e2e/playwright-report/
            ui/e2e/test-results/
          retention-days: 14
