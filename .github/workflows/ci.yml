name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # TODO: re-enable once upstream bug is fixed — dotnet format on
      # .NET 10 SDK 10.0.106 times out its MSBuild build-host pipe.
      # Code style is still enforced at compile time via
      # EnforceCodeStyleInBuild=true + TreatWarningsAsErrors=true in
      # Directory.Build.props.
      # - name: Format check
      #   run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx" --collect:"XPlat Code Coverage"
