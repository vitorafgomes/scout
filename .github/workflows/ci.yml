name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Seconds, no .NET needed, so it runs first; jq ships on ubuntu runners.
      - name: Hook guard self-test
        shell: bash
        run: |
          bash .claude/hooks/pre-git-guard.test.sh
          bash .claude/hooks/stop-review-gate.test.sh
          bash .claude/hooks/session-start.test.sh
          bash .claude/hooks/post-edit-oracle-note.test.sh
          bash .claude/hooks/session-end-metrics.test.sh
          bash scripts/check-vault-refs.test.sh
          bash scripts/check-vault-refs.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Disabled: re-enable "Format check" (exact step name) when
      # `dotnet format --verify-no-changes --no-restore` stops timing out
      # on the MSBuild build-host pipe (.NET 10 SDK 10.0.106 bug).
      # Code style is still enforced at compile time via
      # EnforceCodeStyleInBuild=true + TreatWarningsAsErrors=true in
      # Directory.Build.props.
      # - name: Format check
      #   run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx" --collect:"XPlat Code Coverage"
