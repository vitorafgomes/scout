<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-label="Scout architecture and per-turn flow diagram" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- flow arrowhead (request, accent blue) -->
    <marker id="arrowReq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5db4f0"/>
    </marker>
    <!-- flow arrowhead (response, green) -->
    <marker id="arrowRes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7ad9b0"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="860" fill="#0e1116"/>

  <!-- title -->
  <text x="40" y="44" fill="#f3f7fb" font-size="24" font-weight="700" letter-spacing="-0.4">Scout — active architecture &amp; per-turn flow</text>
  <text x="40" y="68" fill="#97a3b3" font-size="13.5">Read-only ChatOps assistant · Microsoft Semantic Kernel · .NET 10 · local-first Ollama · 13 active projects</text>

  <!-- =========================================================
       LAYER BANDS  (foundation at bottom)
       Each band: rounded rect + label on the left, project boxes on a grid.
       Geometry (x from 250 to 1160 = 910px usable for boxes)
       ========================================================= -->

  <!-- ===== HOSTS (top) ===== -->
  <g>
    <rect x="40" y="92" width="1120" height="84" rx="12" fill="#151a21" stroke="#232c38" stroke-width="1"/>
    <text x="60" y="128" fill="#5db4f0" font-size="13" font-weight="700" letter-spacing="0.6">HOSTS</text>
    <text x="60" y="146" fill="#6c7888" font-size="10.5">Process entry points</text>

    <!-- Host.Console (primary) -->
    <rect x="250" y="108" width="430" height="52" rx="9" fill="#1b222b" stroke="#2a4a63" stroke-width="1.4"/>
    <text x="465" y="132" fill="#eef3f8" font-size="13.5" font-weight="600" text-anchor="middle">Scout.Host.Console</text>
    <text x="465" y="150" fill="#7ad9b0" font-size="10.5" text-anchor="middle">primary composition root</text>

    <!-- Host.ControlPlane -->
    <rect x="710" y="108" width="430" height="52" rx="9" fill="#1b222b" stroke="#232c38" stroke-width="1.2"/>
    <text x="925" y="132" fill="#eef3f8" font-size="13.5" font-weight="600" text-anchor="middle">Scout.Host.ControlPlane</text>
    <text x="925" y="150" fill="#97a3b3" font-size="10.5" text-anchor="middle">control-plane host</text>
  </g>

  <!-- ===== ADAPTERS ===== -->
  <g>
    <rect x="40" y="192" width="1120" height="84" rx="12" fill="#151a21" stroke="#232c38" stroke-width="1"/>
    <text x="60" y="228" fill="#5db4f0" font-size="13" font-weight="700" letter-spacing="0.6">ADAPTERS</text>
    <text x="60" y="246" fill="#6c7888" font-size="10.5">Chat I/O connectors</text>

    <rect x="250" y="208" width="282" height="52" rx="9" fill="#1b222b" stroke="#232c38" stroke-width="1.2"/>
    <text x="391" y="240" fill="#eef3f8" font-size="13.5" font-weight="600" text-anchor="middle">Scout.Adapter.Discord</text>

    <rect x="564" y="208" width="282" height="52" rx="9" fill="#1b222b" stroke="#232c38" stroke-width="1.2"/>
    <text x="705" y="240" fill="#eef3f8" font-size="13.5" font-weight="600" text-anchor="middle">Scout.Adapter.Slack</text>

    <rect x="878" y="208" width="282" height="52" rx="9" fill="#1b222b" stroke="#232c38" stroke-width="1.2"/>
    <text x="1019" y="240" fill="#eef3f8" font-size="13.5" font-weight="600" text-anchor="middle">Scout.Adapter.Teams</text>
  </g>

  <!-- ===== CONVERSATION ===== -->
  <g>
    <rect x="40" y="292" width="1120" height="92" rx="12" fill="#151a21" stroke="#232c38" stroke-width="1"/>
    <text x="60" y="328" fill="#5db4f0" font-size="13" font-weight="700" letter-spacing="0.6">CONVERSATION</text>
    <text x="60" y="346" fill="#6c7888" font-size="10.5">Per-turn loop</text>

    <rect x="250" y="308" width="910" height="60" rx="9" fill="#1b222b" stroke="#2a4a63" stroke-width="1.4"/>
    <text x="705" y="332" fill="#eef3f8" font-size="14" font-weight="600" text-anchor="middle">Scout.Conversation</text>
    <text x="705" y="352" fill="#97a3b3" font-size="11" text-anchor="middle">ConversationConductor · LlmStreamingRouter · in-memory history (channel + user)</text>
  </g>

  <!-- ===== CONTROL PLANE ===== -->
  <g>
    <rect x="40" y="400" width="1120" height="84" rx="12" fill="#151a21" stroke="#232c38" stroke-width="1"/>
    <text x="60" y="436" fill="#5db4f0" font-size="13" font-weight="700" letter-spacing="0.6">CONTROL PLANE</text>
    <text x="60" y="454" fill="#6c7888" font-size="10.5">Management · gRPC</text>

    <rect x="250" y="416" width="446" height="52" rx="9" fill="#1b222b" stroke="#232c38" stroke-width="1.2"/>
    <text x="473" y="440" fill="#eef3f8" font-size="13.5" font-weight="600" text-anchor="middle">Scout.ControlPlane</text>
    <text x="473" y="457" fill="#97a3b3" font-size="10.5" text-anchor="middle">providers · models · features</text>

    <rect x="714" y="416" width="446" height="52" rx="9" fill="#1b222b" stroke="#232c38" stroke-width="1.2"/>
    <text x="937" y="440" fill="#eef3f8" font-size="13.5" font-weight="600" text-anchor="middle">Scout.ControlPlane.Contracts</text>
    <text x="937" y="457" fill="#97a3b3" font-size="10.5" text-anchor="middle">gRPC service contracts</text>
  </g>

  <!-- ===== CAPABILITIES ===== -->
  <g>
    <rect x="40" y="500" width="1120" height="92" rx="12" fill="#151a21" stroke="#232c38" stroke-width="1"/>
    <text x="60" y="536" fill="#5db4f0" font-size="13" font-weight="700" letter-spacing="0.6">CAPABILITIES</text>
    <text x="60" y="554" fill="#6c7888" font-size="10.5">Retrieval &amp; plugins</text>

    <rect x="250" y="516" width="290" height="60" rx="9" fill="#1b222b" stroke="#232c38" stroke-width="1.2"/>
    <text x="395" y="540" fill="#eef3f8" font-size="13.5" font-weight="600" text-anchor="middle">Scout.Knowledge</text>
    <text x="395" y="560" fill="#97a3b3" font-size="10.5" text-anchor="middle">RAG · search_project · find_symbol</text>

    <rect x="560" y="516" width="290" height="60" rx="9" fill="#1b222b" stroke="#232c38" stroke-width="1.2"/>
    <text x="705" y="540" fill="#eef3f8" font-size="13.5" font-weight="600" text-anchor="middle">Scout.Skills</text>
    <text x="705" y="560" fill="#97a3b3" font-size="10.5" text-anchor="middle">embedding retrieval · TopN to prompt</text>

    <rect x="870" y="516" width="290" height="60" rx="9" fill="#1b222b" stroke="#232c38" stroke-width="1.2"/>
    <text x="1015" y="540" fill="#eef3f8" font-size="13.5" font-weight="600" text-anchor="middle">Scout.Plugin.GitHub</text>
    <text x="1015" y="560" fill="#97a3b3" font-size="10.5" text-anchor="middle">Semantic Kernel function</text>
  </g>

  <!-- ===== LLM GATEWAY (foundation, bottom) ===== -->
  <g>
    <rect x="40" y="608" width="1120" height="92" rx="12" fill="#151a21" stroke="#232c38" stroke-width="1"/>
    <text x="60" y="644" fill="#5db4f0" font-size="13" font-weight="700" letter-spacing="0.6">LLM GATEWAY</text>
    <text x="60" y="662" fill="#6c7888" font-size="10.5">Foundation</text>

    <rect x="250" y="624" width="446" height="60" rx="9" fill="#1b222b" stroke="#232c38" stroke-width="1.2"/>
    <text x="473" y="648" fill="#eef3f8" font-size="13.5" font-weight="600" text-anchor="middle">Scout.Llm</text>
    <text x="473" y="668" fill="#97a3b3" font-size="10.5" text-anchor="middle">IChatGateway · streaming-first</text>

    <rect x="714" y="624" width="446" height="60" rx="9" fill="#1b222b" stroke="#232c38" stroke-width="1.2"/>
    <text x="937" y="648" fill="#eef3f8" font-size="13.5" font-weight="600" text-anchor="middle">Scout.Llm.Ollama</text>
    <text x="937" y="668" fill="#97a3b3" font-size="10.5" text-anchor="middle">chat via /v1 · embeddings via native Ollama</text>
  </g>

  <!-- external runtime: Semantic Kernel + Ollama LLM -->
  <rect x="250" y="716" width="910" height="44" rx="9" fill="#0a0d12" stroke="#2a4a63" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="705" y="743" fill="#e9b872" font-size="12.5" font-weight="600" text-anchor="middle">Semantic Kernel + Ollama LLM  ·  function-calling: search_project / find_symbol</text>

  <!-- =========================================================
       PER-TURN FLOW ARROWS (hot path)
       Request path (blue, down) on the left edge of the box column;
       Response path (green, up) on the right edge.
       ========================================================= -->

  <!-- request: User -> Adapter -> Conversation -> Capabilities -> LLM -> SK/Ollama -->
  <!-- vertical request channel at x=200 -->
  <g stroke="#5db4f0" stroke-width="2.2" fill="none">
    <path d="M200 234 L200 332" marker-end="url(#arrowReq)"/>
    <path d="M200 354 L200 442" marker-end="url(#arrowReq)"/>
    <path d="M200 462 L200 650" marker-end="url(#arrowReq)"/>
    <path d="M200 670 L200 736" marker-end="url(#arrowReq)"/>
  </g>
  <!-- connectors from request channel into layer boxes -->
  <g stroke="#5db4f0" stroke-width="1.6" fill="none" opacity="0.85">
    <path d="M200 234 L246 234" marker-end="url(#arrowReq)"/>
    <path d="M200 338 L246 338" marker-end="url(#arrowReq)"/>
  </g>

  <!-- response: tokens stream back out the same path (green, up) at x=1192 right gutter -->
  <g stroke="#7ad9b0" stroke-width="2.2" fill="none">
    <path d="M1180 736 L1180 462" marker-end="url(#arrowRes)"/>
    <path d="M1180 442 L1180 354" marker-end="url(#arrowRes)"/>
    <path d="M1180 332 L1180 234" marker-end="url(#arrowRes)"/>
  </g>

  <!-- flow stage labels along the request channel -->
  <g fill="#5db4f0" font-size="10.5" font-weight="600">
    <text x="186" y="282" text-anchor="end">1 normalize</text>
    <text x="186" y="400" text-anchor="end">2 select skill</text>
    <text x="186" y="556" text-anchor="end">3 build request</text>
    <text x="186" y="706" text-anchor="end">4 invoke</text>
  </g>
  <g fill="#7ad9b0" font-size="10.5" font-weight="600">
    <text x="1166" y="600" text-anchor="end">stream tokens back</text>
  </g>

  <!-- entry point: User -->
  <g>
    <rect x="40" y="208" width="150" height="52" rx="9" fill="#0a0d12" stroke="#5db4f0" stroke-width="1.4"/>
    <text x="115" y="232" fill="#f3f7fb" font-size="13" font-weight="700" text-anchor="middle">User</text>
    <text x="115" y="250" fill="#97a3b3" font-size="10" text-anchor="middle">Discord/Slack/Teams</text>
  </g>

  <!-- =========================================================
       LEGEND
       ========================================================= -->
  <g>
    <rect x="40" y="784" width="1120" height="56" rx="10" fill="#151a21" stroke="#232c38" stroke-width="1"/>
    <text x="60" y="808" fill="#97a3b3" font-size="11" font-weight="700" letter-spacing="0.6">FLOW</text>

    <!-- request key -->
    <line x1="118" y1="812" x2="152" y2="812" stroke="#5db4f0" stroke-width="2.6" marker-end="url(#arrowReq)"/>
    <text x="162" y="816" fill="#d7dde6" font-size="11">Request: User → Adapter → Conductor → Router (history + skill + grounding) → Gateway</text>

    <!-- response key -->
    <line x1="118" y1="828" x2="152" y2="828" stroke="#7ad9b0" stroke-width="2.6" marker-end="url(#arrowRes)"/>
    <text x="162" y="832" fill="#d7dde6" font-size="11">Response: tokens streamed back out the same path; function-calling → Scout.Knowledge mid-stream</text>

    <!-- box key -->
    <rect x="760" y="800" width="22" height="14" rx="3" fill="#1b222b" stroke="#2a4a63" stroke-width="1.2"/>
    <text x="790" y="811" fill="#d7dde6" font-size="11.5">hot-path project</text>
    <rect x="950" y="800" width="22" height="14" rx="3" fill="#0a0d12" stroke="#2a4a63" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="980" y="811" fill="#d7dde6" font-size="11.5">external runtime</text>
    <text x="760" y="832" fill="#6c7888" font-size="11">Layers read bottom-up: LLM gateway is the foundation; hosts compose the stack at the top.</text>
  </g>
</svg>
