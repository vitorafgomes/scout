<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scout Desktop: Floating button</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7aa2f7}a:hover{color:#a9c1fa}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #7aa2f7;outline-offset:2px}
@keyframes scRing{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.45);opacity:0}}
.sc-ring{animation:scRing 1.4s ease-out infinite}
@media (prefers-reduced-motion: reduce){.sc-ring{animation:none;opacity:.5}}
</style>
</helmet>
<div style="min-height: 360px; display: flex; flex-direction: column; font-family: Inter, -apple-system, 'Segoe UI', sans-serif; background: {{t.desk}}; color: {{t.fg}}; font-size: 13px; position: relative; overflow: hidden">

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 10px; background: {{t.surface}}; border-bottom: 1px dashed {{t.line}}; font-size: 11px; color: {{t.muted}}">
<span id="pv-label">Preview state</span>
<div role="group" aria-labelledby="pv-label" style="display: flex; flex-wrap: wrap; gap: 2px; margin-right: auto">
<sc-for list="{{previews}}" as="p" hint-placeholder-count="4">
<button aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="height: 24px; padding: 0 8px; border: 0; border-radius: 12px; font-size: 11px; background: {{p.bg}}; color: {{p.fg}}; font-weight: {{p.weight}}">{{p.label}}</button>
</sc-for>
</div>
<div role="group" aria-label="Theme" style="display: flex; gap: 2px; padding: 2px; border: 1px solid {{t.line}}; border-radius: 14px; background: {{t.bg}}">
<button aria-label="Light theme" title="Light theme" aria-pressed="{{themeLight.pressed}}" onClick="{{setLight}}" style="width: 26px; height: 22px; border: 0; border-radius: 11px; display: flex; align-items: center; justify-content: center; background: {{themeLight.bg}}; color: {{themeLight.fg}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></button>
<button aria-label="Dark theme" title="Dark theme" aria-pressed="{{themeDark.pressed}}" onClick="{{setDark}}" style="width: 26px; height: 22px; border: 0; border-radius: 11px; display: flex; align-items: center; justify-content: center; background: {{themeDark.bg}}; color: {{themeDark.fg}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></button>
<button aria-label="Follow the system theme" title="Follow the system theme" aria-pressed="{{themeSystem.pressed}}" onClick="{{setSystem}}" style="width: 26px; height: 22px; border: 0; border-radius: 11px; display: flex; align-items: center; justify-content: center; background: {{themeSystem.bg}}; color: {{themeSystem.fg}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg></button>
</div>
</div>

<div aria-hidden="true" style="position: absolute; left: 24px; top: 64px; width: 210px; height: 150px; border-radius: 10px; background: {{t.window}}; border: 1px solid {{t.windowLine}}; box-shadow: 0 10px 30px {{t.shadow}}">
<div style="height: 22px; border-bottom: 1px solid {{t.windowLine}}; display: flex; align-items: center; gap: 5px; padding: 0 8px"><span style="width: 7px; height: 7px; border-radius: 4px; background: {{t.windowLine}}"></span><span style="width: 7px; height: 7px; border-radius: 4px; background: {{t.windowLine}}"></span><span style="width: 7px; height: 7px; border-radius: 4px; background: {{t.windowLine}}"></span></div>
<div style="padding: 12px; display: flex; flex-direction: column; gap: 8px"><div style="height: 8px; width: 70%; border-radius: 4px; background: {{t.windowLine}}"></div><div style="height: 8px; width: 85%; border-radius: 4px; background: {{t.windowLine}}"></div><div style="height: 8px; width: 55%; border-radius: 4px; background: {{t.windowLine}}"></div></div>
</div>

<div style="position: absolute; right: 28px; bottom: 28px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px">
<div role="status" style="max-width: 220px; padding: 8px 10px; border-radius: 10px; background: {{t.surface}}; border: 1px solid {{t.line}}; box-shadow: 0 6px 18px {{t.shadow}}; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 600; color: {{t.fg}}">{{stateTitle}}</span>
<span style="font-size: 12px; color: {{t.fg2}}; line-height: 1.4">{{stateText}}</span>
</div>
<div style="position: relative; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center">
<sc-if value="{{hasRing}}" hint-placeholder-val="{{false}}">
<span aria-hidden="true" class="sc-ring" style="position: absolute; left: 4px; top: 4px; width: 56px; height: 56px; border-radius: 28px; border: 3px solid {{ringColor}}; box-sizing: border-box"></span>
</sc-if>
<a href="QuickAsk.dc.html" aria-label="{{label}}" title="{{title}}" style="position: relative; width: 56px; height: 56px; border-radius: 28px; background: {{t.accentStrong}}; color: #ffffff; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 6px 16px {{t.shadow}}">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"></rect><path d="M12 8V4M9 4h6"></path><circle cx="9" cy="14" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="15" cy="14" r="1.2" fill="currentColor" stroke="none"></circle></svg>
</a>
<sc-if value="{{hasBadge}}" hint-placeholder-val="{{false}}">
<span aria-hidden="true" style="position: absolute; right: 2px; top: 2px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; border: 2px solid {{t.desk}}; background: {{badgeBg}}; color: #ffffff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{badgeText}}</span>
</sc-if>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":360}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: 'dark', preview: 'idle' };
  }
  palette(mode) {
    if (mode === 'light') {
      return { bg: '#f5f7fb', surface: '#ffffff', line: '#d7dce7', fg: '#18202e', fg2: '#3f4a61', muted: '#5d677d', accent: '#2a56c6', accentStrong: '#2a56c6', err: '#b3261e', recording: '#b3261e', shadow: 'rgba(24,32,46,0.18)', pressedBg: '#ffffff', pressedFg: '#18202e', idleFg: '#5d677d', desk: '#d9dee7', window: '#eef1f6', windowLine: '#c7cedb' };
    }
    return { bg: '#0f1623', surface: '#131c2d', line: '#253249', fg: '#e6e9f0', fg2: '#c3cadb', muted: '#9aa3b6', accent: '#8fb2f9', accentStrong: '#3b6ff2', err: '#c5372c', recording: '#e5534b', shadow: 'rgba(0,0,0,0.5)', pressedBg: '#253249', pressedFg: '#e6e9f0', idleFg: '#9aa3b6', desk: '#1c222c', window: '#262d39', windowLine: '#38414f' };
  }
  renderVals() {
    const mode = this.state.theme === 'system' ? 'dark' : this.state.theme;
    const t = this.palette(mode);
    const p = this.state.preview;
    const shortcut = 'Ctrl+Alt+Space';
    const states = {
      idle: { title: 'Ask Scout (' + shortcut + ')', label: 'Ask Scout', stateTitle: 'Idle', stateText: 'Click, or press ' + shortcut + ', to open the quick ask window.', ring: false, badge: '' },
      noShortcut: { title: 'Ask Scout', label: 'Ask Scout', stateTitle: 'Idle', stateText: 'Click to open the quick ask window.', ring: false, badge: '' },
      listening: { title: 'Scout is listening. Open to see the transcript.', label: 'Ask Scout, listening', stateTitle: 'Listening', stateText: 'A Listen, System audio or Meeting is open; this shows ahead of answering and error, so an open microphone is never hidden. Open the quick ask window to see the transcript.', ring: true, ringColor: t.recording, badge: 'rec' },
      busy: { title: 'Scout is answering. Open to follow the answer.', label: 'Ask Scout, answering', stateTitle: 'Answering', stateText: 'Scout is working on your question. One question at a time.', ring: true, ringColor: t.accent, badge: '' },
      error: { title: 'Scout could not answer. Open to see why.', label: 'Ask Scout, the last answer failed', stateTitle: 'Error', stateText: 'The last answer failed, the worker not running included; a stop by you is not a failure. Open the quick ask window to read the reason.', ring: false, badge: 'err' },
    };
    const st = states[p];
    const pill = (on) => ({ bg: on ? t.pressedBg : 'transparent', fg: on ? t.pressedFg : t.idleFg, pressed: on ? 'true' : 'false' });
    const previews = [['idle', 'Idle'], ['noShortcut', 'Idle, no shortcut'], ['listening', 'Listening'], ['busy', 'Answering'], ['error', 'Error']].map(([id, label]) => {
      const on = p === id;
      return { label, pressed: on ? 'true' : 'false', bg: on ? t.pressedBg : 'transparent', fg: on ? t.pressedFg : t.idleFg, weight: on ? 600 : 500, pick: () => this.setState({ preview: id }) };
    });
    return {
      t,
      previews,
      label: st.label,
      title: st.title,
      stateTitle: st.stateTitle,
      stateText: st.stateText,
      hasRing: st.ring,
      ringColor: st.ring ? st.ringColor : 'transparent',
      hasBadge: st.badge !== '',
      badgeBg: st.badge === 'err' ? t.err : t.recording,
      badgeText: st.badge === 'err' ? '!' : '',
      themeLight: pill(this.state.theme === 'light'),
      themeDark: pill(this.state.theme === 'dark'),
      themeSystem: pill(this.state.theme === 'system'),
      setLight: () => this.setState({ theme: 'light' }),
      setDark: () => this.setState({ theme: 'dark' }),
      setSystem: () => this.setState({ theme: 'system' }),
    };
  }
}
</script>
</body>
</html>
